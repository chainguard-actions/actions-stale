name: Test basic stale action usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity.'
          stale-pr-message: 'This PR is stale because it has been open 60 days with no activity.'
          close-issue-message: 'This issue was closed because it has been stale for 7 days with no activity.'
          close-pr-message: 'This PR was closed because it has been stale for 7 days with no activity.'
          close-issue-label: 'wontfix'
          close-pr-label: 'wontfix'
          days-before-stale: '60'
          days-before-close: '7'
          stale-issue-label: 'Stale'
          stale-pr-label: 'Stale'
          operations-per-run: '1'
          debug-only: 'true'
      - name: Assert action completed
        run: |
          echo "Action completed successfully in debug-only mode"
          echo "PASS"
