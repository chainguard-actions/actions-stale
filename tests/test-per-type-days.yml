name: Test per-type stale and close days
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: '45'
          days-before-issue-close: '5'
          days-before-pr-stale: '30'
          days-before-pr-close: '3'
          stale-issue-message: 'This issue is stale.'
          stale-pr-message: 'This PR is stale.'
          debug-only: 'true'
          operations-per-run: '1'
      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          STALED: ${{ steps.action.outputs.staled-issues-prs }}
          CLOSED: ${{ steps.action.outputs.closed-issues-prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "staled-issues-prs: $STALED"
          echo "closed-issues-prs: $CLOSED"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in debug-only mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
