name: Test issue and PR specific close days
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          stale-issue-message: 'This issue is stale.'
          stale-pr-message: 'This PR is stale.'
          days-before-issue-stale: '60'
          days-before-pr-stale: '30'
          days-before-issue-close: '14'
          days-before-pr-close: '5'
          debug-only: 'true'
      - name: Assert action completed
        env:
          STALED: ${{ steps.action.outputs.staled-issues-prs }}
          CLOSED: ${{ steps.action.outputs.closed-issues-prs }}
        run: |
          echo "staled-issues-prs: $STALED"
          echo "closed-issues-prs: $CLOSED"
          echo "PASS: action completed successfully with per-type close days"
