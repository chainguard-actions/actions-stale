name: Test stale action with issue and PR specific overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: '45'
          days-before-pr-stale: '30'
          days-before-issue-close: '10'
          days-before-pr-close: '5'
          stale-issue-message: 'This issue is stale.'
          stale-pr-message: 'This PR is stale.'
          close-issue-message: 'Closing this stale issue.'
          close-pr-message: 'Closing this stale PR.'
          close-issue-label: 'closed-stale'
          close-pr-label: 'closed-stale'
          operations-per-run: '1'
          debug-only: 'true'
      - name: Assert action completed with overrides
        run: |
          echo "Action completed successfully with issue/PR specific overrides in debug-only mode"
          echo "PASS"
