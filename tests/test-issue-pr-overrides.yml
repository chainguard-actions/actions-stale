name: Test issue and PR specific overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo-token: ${{ github.token }}
          days-before-issue-stale: '90'
          days-before-pr-stale: '30'
          days-before-issue-close: '14'
          days-before-pr-close: '5'
          close-issue-label: 'closed-stale'
          close-pr-label: 'closed-stale-pr'
          stale-issue-label: 'Stale'
          stale-pr-label: 'Stale'
          debug-only: 'true'
          operations-per-run: '1'
      - name: Assert action completed
        env:
          STALED: ${{ steps.action.outputs.staled-issues-prs }}
          CLOSED: ${{ steps.action.outputs.closed-issues-prs }}
        run: |
          echo "staled-issues-prs: $STALED"
          echo "closed-issues-prs: $CLOSED"
          echo "PASS: action completed with issue/PR override inputs"
